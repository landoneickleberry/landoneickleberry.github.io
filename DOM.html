
<!DOCTYPE html>
<html>
<body>
<pre>
    <h1 id = "welcome"></h1>
    <script>
        let name = prompt("What is your name?");
        //Store the tag with the id "welcome" in variable welcome
        let welcome = document.getElementById("welcome");
        //Set the value of the innerHTML for id "welcome"
        welcome.innerHTML = "Welcome to my site, " + name +"!";
        let age = prompt("What is your age?")
        if (age > 18) {
            welcome.innerHTML = "You're not welcome, " + name +"!";
        }
        else {
            welcome.innerHTML = "Welcome to my site, " + name +"!";
        }
    </script>
</pre>
</body>
</html>
