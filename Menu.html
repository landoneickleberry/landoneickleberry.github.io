<!DOCTYPE html>
<html>
	<body>
	    <h2>Tonight's Menu</h2>
		<ol>
		    <li>Caesar Salad</li>
		    <li>French Onion Soup</li>
		    <li>Mac N Cheese</li>
		    <li>Pork Chops with Spinach</li>
		    <li>Cheesecake</li>
		</ol>
		<script>
		    let best = prompt("What is your favorite item?");
		    let least = prompt("What is your least favorite item?")
		    let list = document.getElementsByTagName("li");
		    console.log(best)
		    for (let i = 0; i < list.length; i++) {

		        if (list[i].innerHTML == best) {
		            alert("Your favorite menu item is " + list[i].innerHTML)
		        }
		        if (list[i].innerHTML == least) {
		            alert("Your least favorite menu item, " + list[i].innerHTML)
		        }
		    }
		    
		    

		</script>
	</body>
</html>
